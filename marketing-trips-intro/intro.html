<button id="replay" onclick="play()">↻ Replay</button>
<script>
const DUR=6.0;
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3);
const eExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
// logo in SVG user units: content bbox x 787..7681, y 1369..3744
const SC=0.185, CX=(787+7681)/2, CY=(1369+3744)/2;
const RCX=1748.6, RCY=1747.5; // ring centre
const ICX=(787+2780)/2, ICY=(788+3744)/2; // icon centre
const bodyLen=$('bodyStroke').getTotalLength();
$('bodyStroke').style.strokeDasharray=bodyLen;
const l1=[...document.querySelectorAll('.l1')], l2=[...document.querySelectorAll('.l2')];

function render(t){
  // camera: icon alone centred, then slides to final layout; slow push-in
  const slide=eInOut(seg(t,1.75,2.75));
  const offX=(CX-ICX)*(1-slide), offY=(CY-ICY)*(1-slide);
  const push=1+0.035*eOut(seg(t,2.2,DUR));
  const s=SC*push*(1.25-0.25*slide);
  $('world').setAttribute('transform',`translate(960 540) scale(${s}) translate(${-CX+offX} ${-CY+offY})`);

  // ring: pop with overshoot
  const rp=seg(t,0.25,0.85), rs=rp<=0?0:eBack(rp);
  $('ringG').setAttribute('transform',`translate(${RCX} ${RCY}) scale(${rs}) rotate(${-90*(1-eOut(rp))}) translate(${-RCX} ${-RCY})`);
  // pulse wave from ring
  const wp=seg(t,0.7,1.6);
  $('wave').setAttribute('r',400+900*eOut(wp));
  $('wave').setAttribute('opacity',wp>0?(1-wp):0);

  // body: stroke draw then fill
  const dp=eInOut(seg(t,0.55,1.45));
  const bs=$('bodyStroke');
  bs.style.strokeDashoffset=bodyLen*(1-dp);
  bs.style.opacity=t<0.55?0:1-seg(t,1.45,1.75);
  $('body').style.opacity=eOut(seg(t,1.2,1.6));

  // foot: slides in diagonally
  const fp=seg(t,1.15,1.75), fe=eBack(fp);
  $('foot').setAttribute('transform',`translate(${-260*(1-fe)} ${260*(1-fe)})`);
  $('foot').style.opacity=clamp(fp*3);

  // letters rise from their line masks
  const rise=(arr,start,gap)=>arr.forEach((el,i)=>{
    const p=seg(t,start+i*gap,start+i*gap+0.7), e=eExpo(p);
    el.setAttribute('transform',`translate(0 ${900*(1-e)})`);
  });
  rise(l1,2.15,0.055);
  rise(l2,2.65,0.065);

  // closing heartbeat on ring
  const hb=seg(t,4.1,4.6), k=1+0.08*Math.sin(Math.PI*hb);
  if(hb>0&&hb<1) $('ringG').setAttribute('transform',`translate(${RCX} ${RCY}) scale(${k}) translate(${-RCX} ${-RCY})`);
}
window.render=render; window.DUR=DUR;
let raf;
function play(){cancelAnimationFrame(raf);const t0=performance.now();
  const f=n=>{const t=(n-t0)/1000;render(Math.min(t,DUR));if(t<DUR)raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f);}
if(!location.hash.includes('render')) play(); else {document.body.classList.add('render');render(0);}
</script>
