  <g id="txt2"><path class="ltr l2" d="M3947.66 2385.96L3444.12 2385.96L3444.12 2500.65L3634.59 2500.65L3634.59 3001.11L3757.18 3001.11L3757.18 2500.65L3947.65 2500.65L3947.65 2385.96Z"/><path class="ltr l2" d="M4205.28 2564.14C4153.06 2564.14 4112.24 2582.13 4085.47 2622.22L4085.47 2575.41L3974.29 2575.41L3974.29 3001.12L4088.98 3001.12L4088.98 2769.10C4088.98 2706.05 4125.41 2673.57 4178.51 2673.57C4201.77 2673.57 4228.98 2678.84 4247.85 2687.18L4264.97 2573.37C4249.17 2567.67 4229.86 2564.15 4205.28 2564.15Z"/><path class="ltr l2" d="M4457.63 2575.40L4342.94 2575.40L4342.94 3001.11L4457.63 3001.11L4457.63 2575.40ZM4399.85 2362.99C4358.60 2362.99 4327.00 2395.47 4327.00 2436.72C4327.00 2477.98 4358.60 2509.57 4399.85 2509.57C4441.11 2509.57 4473.14 2477.97 4473.14 2436.72C4473.14 2395.47 4441.10 2362.99 4399.85 2362.99Z"/><path class="ltr l2" d="M4817.22 2564.14C4758.85 2564.14 4718.03 2587.84 4690.39 2622.66L4690.39 2575.41L4578.48 2575.41L4578.48 3176.67L4692.59 3176.67L4692.59 2956.06C4720.24 2989.12 4760.61 3011.50 4817.67 3011.50C4934.85 3011.50 5023.50 2915.24 5023.50 2787.67C5023.50 2660.40 4934.85 2564.14 4817.23 2564.14ZM4796.16 2670.93C4863.75 2670.93 4905.88 2723.01 4905.88 2787.82C4905.88 2852.63 4863.75 2904.71 4796.16 2904.71C4731.20 2904.71 4686.88 2854.82 4686.88 2787.82C4686.88 2720.82 4731.21 2670.93 4796.16 2670.93Z"/><path class="ltr l2" d="M5457.54 2605.24C5400.92 2577.59 5347.82 2564.87 5279.50 2564.87C5167.44 2564.87 5099.85 2616.66 5099.85 2703.85C5099.85 2775.97 5148.57 2818.98 5246.87 2832.44L5281.69 2837.27C5331.13 2844.29 5352.64 2855.70 5352.64 2876.33C5352.64 2901.20 5327.19 2916.12 5273.79 2916.12C5209.57 2916.12 5165.24 2898.56 5128.82 2874.57L5083.62 2961.32C5138.92 3000.52 5214.84 3011.50 5272.92 3011.50C5396.54 3011.50 5468.51 2954.74 5468.51 2867.11C5468.51 2795.28 5417.16 2754.17 5325.00 2740.13L5287.11 2734.43C5248.20 2728.73 5217.48 2722.58 5217.48 2698.15C5217.48 2674.89 5239.42 2659.67 5283.02 2659.67C5331.15 2660.11 5385.1 <button id="replay" onclick="play()">↻ Replay</button>
<script>
const DUR=9.0, NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
const eOut=x=>1-Math.pow(1-x,3), eIn=x=>x*x, eExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eQuadOut=x=>1-(1-x)*(1-x);
const eBack=x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function rnd(s){return ()=>{s=(s*16807)%2147483647;return (s-1)/2147483646}}
const R=rnd(7);
const mk=(tag,parent,attrs)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e};

const SC=0.158, CX=(787+7681)/2, CY=(788+3744)/2, SCY=470;
const LY=2345, TX0=3444, TX1=7681, TCX=(TX0+TX1)/2;
const DOT_R=78, LINE_H=26;
const PA=[1420,2850], PB=[1880,3000];
const WALK=-5600, W0=2.5, W1=4.4, STEPS=4.5;
const DROP=[0,1,2].map(i=>0.35+i*0.16);       // drop start
const LAND=DROP.map(t=>t+0.55);                 // landing time
const MERGE=1.95;
const CONTACTS=[...Array(8)].map((_,k)=>W0+(W1-W0)*(k+1)/(2*STEPS));
window.TIMES={LAND,MERGE,CONTACTS,ARRIVE:4.4,REVEAL:3.45,SHINE:5.05,SIG:5.3,DUR};

// background bokeh particles (screen space)
const parts=[...Array(34)].map(()=>{const c=mk('circle',$('particles'),{r:2+R()*7,fill:R()<.18?'#ff3b3b':'#9a9aa4'});
  return {c,x:R()*1920,y:R()*1080,vx:(R()-.5)*14,vy:-4-R()*10,o:.08+R()*.22,depth:.2+R()*.8}});

// fx pools
const fx=$('fx');
const ripples=LAND.map(()=>[mk('ellipse',fx,{fill:'none',stroke:'#000'}),mk('ellipse',fx,{fill:'none',stroke:'#000'})]);
const splash=LAND.map(()=>[...Array(7)].map(()=>({c:mk('circle',fx,{fill:'#000'}),a:-Math.PI/2+(R()-.5)*2.4,v:500+R()*700,r:10+R()*12})));
const mergeRing=mk('circle',fx,{cx:TCX,cy:LY,fill:'none',stroke:'#ff0000'});
const puffs=CONTACTS.map((tc,k)=>[...Array(5)].map(()=>({c:mk('circle',fx,{fill:'#b9b9c0'}),dx:(R()-.5)*500,dy:-R()*260,r:50+R()*70})));

const dots=[...document.querySelectorAll('.dot')];
const letters=[...document.querySelectorAll('.ltr')].map(el=>{const b=el.getBBox();return {el,x0:b.x,x1:b.x+b.width}});
const ghosts=[...document.querySelectorAll('.ghost')];
const swash=$('swash'), swL=swash.getTotalLength(); swash.style.strokeDasharray=swL;
const rot=(a,p)=>`rotate(${a} ${p[0]} ${p[1]})`;

function walkState(t){
  const wp=seg(t,W0,W1), we=eQuadOut(wp), ph=wp*STEPS*Math.PI*2;
  const amp=8*(1-eIn(seg(t,4.05,4.45))), k=amp/8;
  return {x:WALK*(1-we), bob:-Math.abs(Math.sin(ph))*90*k, swing:Math.sin(ph)*amp, lean:3.5*(1-we)*k, wp};
}

function render(t){
  // camera: starts close on the dots, dollies out to the full logo
  const cz=eInOut(seg(t,1.9,4.7));
  const zoom=lerp(1.6,1,cz)*(1+0.035*eOut(seg(t,4.6,DUR)));
  const fxp=lerp(TCX,CX,cz), fyp=lerp(LY,CY,cz);
  const camRot=lerp(-2.2,0,eInOut(seg(t,0,4.6)));
  $('world').setAttribute('transform',`translate(960 ${SCY}) rotate(${camRot}) scale(${SC*zoom}) translate(${-fxp} ${-fyp})`);
  // parallax bokeh
  parts.forEach(p=>{let x=(p.x+p.vx*t - (fxp-CX)*SC*0.15*p.depth)%1920, y=(p.y+p.vy*t+1080)%1080;
    if(x<0)x+=1920; p.c.setAttribute('cx',x);p.c.setAttribute('cy',y);
    p.c.setAttribute('opacity',p.o*clamp(t/0.8));});

  // 1. dots fall with motion stretch, land with ripples + splash
  const mp=seg(t,1.62,MERGE), anti=Math.sin(Math.PI*clamp(mp/0.35))*0.18*(mp<0.35?1:0);
  const mpe=eIn(clamp((mp-0.2)/0.8));
  const gap=230;
  dots.forEach((d,i)=>{
    const t0=DROP[i], fp=seg(t,t0,LAND[i]);
    let y=-4200+(LY+4200)*eIn(fp), sx=1, sy=1;
    const vel=fp>0&&fp<1?fp:0;
    sy=1+vel*1.4; sx=1-vel*0.25;
    const bp=seg(t,LAND[i],LAND[i]+0.42);
    y-=Math.sin(Math.PI*bp)*300*(1-bp*0.4);
    const sq=Math.sin(Math.PI*seg(t,LAND[i],LAND[i]+0.16));
    if(fp>=1){sx=1+0.55*sq; sy=1-0.4*sq;}
    let x=TCX+(i-1)*gap*(1+anti-mpe);
    if(t>MERGE-0.1){const c=seg(t,MERGE-0.1,MERGE);sx*=1+0.6*c*(i!==1);}
    d.setAttribute('cx',x); d.setAttribute('cy',y-(sy-1)*DOT_R);
    d.setAttribute('rx',fp>0&&t<MERGE?DOT_R*sx:0); d.setAttribute('ry',DOT_R*sy);
    const tr=$('trail'+i), tl=vel*1800;
    tr.setAttribute('x',x-DOT_R*0.7);tr.setAttribute('width',fp>0&&fp<1?DOT_R*1.4:0);
    tr.setAttribute('y',y-tl);tr.setAttribute('height',tl);tr.setAttribute('rx',DOT_R*0.7);
    // ripples
    ripples[i].forEach((rp,j)=>{const q=seg(t,LAND[i]+j*0.09,LAND[i]+j*0.09+0.75),e=eOut(q);
      rp.setAttribute('cx',TCX+(i-1)*gap);rp.setAttribute('cy',LY+DOT_R);
      rp.setAttribute('rx',DOT_R+620*e);rp.setAttribute('ry',(DOT_R+620*e)*0.22);
      rp.setAttribute('stroke-width',16*(1-e)+2);rp.setAttribute('opacity',q>0&&q<1?(1-q)*0.45:0);});
    splash[i].forEach(s=>{const q=seg(t,LAND[i],LAND[i]+0.5),T=q*0.5;
      const px=TCX+(i-1)*gap+Math.cos(s.a)*s.v*T, py=LY+DOT_R+Math.sin(s.a)*s.v*T+2600*T*T;
      s.c.setAttribute('cx',px);s.c.setAttribute('cy',py);s.c.setAttribute('r',q>0&&q<1?s.r*(1-q):0);});
  });

  // 2. merge flash + line shoots out
  const fl=seg(t,MERGE,MERGE+0.55);
  $('flash').setAttribute('r',fl>0&&fl<1?200+900*eOut(fl):0);$('flash').setAttribute('opacity',1-fl);
  mergeRing.setAttribute('r',fl>0&&fl<1?DOT_R+800*eOut(fl):0);mergeRing.setAttribute('stroke-width',24*(1-fl));mergeRing.setAttribute('opacity',(1-fl)*0.7);
  const lp=eExpo(seg(t,MERGE,MERGE+0.75));
  const lh=DOT_R*2+(LINE_H-DOT_R*2)*eOut(seg(t,MERGE,MERGE+0.4));
  let lx0=TCX-(TCX-TX0)*lp, lx1=TCX+(TX1-TCX)*lp;

  // 4. line becomes text
  const R0=3.45,R1=4.7, front=TX0+(TX1-TX0+600)*eInOut(seg(t,R0,R1))-300;
  letters.forEach(L=>{
    const q=seg(front,L.x0-150,L.x1+700), p=q<=0?0:eBack(q);
    L.el.setAttribute('transform',`translate(0 ${LY}) scale(1 ${Math.max(p,0.0001)}) translate(0 ${-LY})`);
    L.el.style.opacity=q>0?1:0;
  });
  lx0=Math.max(lx0,Math.min(front+300,TX1));
  const lw=Math.max(0,lx1-lx0), line=$('line');
  line.setAttribute('x',lx0);line.setAttribute('width',t<MERGE?0:lw);
  line.setAttribute('y',LY-lh/2);line.setAttribute('height',lh);line.setAttribute('rx',lh/2);
  const tipO=t<MERGE?0:1-seg(t,MERGE+0.6,MERGE+1.0);
  [['tipL',lx0],['tipR',lx1]].forEach(([id,x])=>{$(id).setAttribute('cx',x);$(id).setAttribute('cy',LY);$(id).setAttribute('r',lw>0?34*tipO:0);});

  // 3. icon walks in: legs, bob, ghosts, shadow, dust
  const w=walkState(t);
  $('iconWalk').setAttribute('transform',`translate(${w.x} ${w.bob})`);
  const hb=seg(t,4.38,4.9), sq=Math.sin(Math.PI*hb)*(1-hb);
  $('icon').setAttribute('transform',`${rot(w.lean,[1750,3000])} translate(1750 3760) scale(${1+0.05*sq} ${1-0.08*sq}) translate(-1750 -3760)`);
  $('legA').setAttribute('transform',rot(w.swing,PA));
  $('legB').setAttribute('transform',rot(-w.swing,PB));
  ghosts.forEach((g,i)=>{const ws=walkState(t-(i+1)*0.045), speed=clamp((ws.x-w.x)/-1)*0;
    const sp=Math.abs(w.x-ws.x); g.setAttribute('transform',`translate(${ws.x} ${ws.bob})`);
    g.setAttribute('opacity',clamp(sp/260)*[0.16,0.09,0.05][i]);});
  const sh=$('shadow'); sh.setAttribute('cx',1780+w.x);
  sh.setAttribute('rx',950*(1+w.bob/900));sh.setAttribute('opacity',t<W0?0:(0.16+w.bob/2000)*(1-0.6*seg(t,4.6,5.6)));
  CONTACTS.forEach((tc,k)=>{const ws=walkState(tc), fx0=(k%2?2350:1150)+ws.x;
    puffs[k].forEach(p=>{const q=seg(t,tc,tc+0.6),e=eOut(q);
      p.c.setAttribute('cx',fx0+p.dx*e);p.c.setAttribute('cy',3720+p.dy*e);
      p.c.setAttribute('r',q>0&&q<1?p.r*(0.4+e):0);p.c.setAttribute('opacity',(1-q)*0.35);});});
  // arrival pulse from the ring
  const pu=seg(t,4.4,5.3), pe=eOut(pu);
  $('pulse').setAttribute('r',pu>0&&pu<1?420+1500*pe:0);$('pulse').setAttribute('stroke-width',50*(1-pe)+3);$('pulse').setAttribute('opacity',(1-pu)*0.55);

  // shine sweep across the finished logo
  const shp=eInOut(seg(t,5.05,6.0));
  $('shine').setAttribute('transform',`translate(${lerp(-1800,8400,shp)} 0) skewX(-22)`);
  $('shine').setAttribute('opacity',shp>0&&shp<1?1:0);

  // 5. signature focuses from blur, swash draws
  const sp=seg(t,5.3,6.8), se=eOut(sp);
  $('blurN').setAttribute('stdDeviation',(1-se)*24);
  const sig=$('sig'); sig.style.opacity=clamp(sp*1.8);
  sig.setAttribute('transform',`translate(960 880) scale(${1.1-0.1*se}) translate(-960 -880)`);
  sig.setAttribute('letter-spacing',10*(1-se));
  swash.style.strokeDashoffset=swL*(1-eInOut(seg(t,6.3,7.2)));
  swash.style.opacity=t<6.3?0:1;
}
window.render=render; window.DUR=DUR;
let raf;
function play(){cancelAnimationFrame(raf);const t0=performance.now();
  const f=n=>{const t=(n-t0)/1000;render(Math.min(t,DUR));if(t<DUR)raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f);}
document.fonts.ready.then(()=>{ if(!location.hash.includes('render')) play(); else {document.body.classList.add('render');render(0);window.READY=true;} });
render(0);
</script>
